name: Personal focused upstream fixes validation
on:
  push:
    branches: [agent/upstream-selected-20261101]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-upstream-fixes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: node:24-bookworm
      options: --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Upstream fixes and personal feature regressions
        run: >-
          timeout 900 vp test run --maxWorkers 1
          apps/server/src/process/externalLauncher.test.ts
          packages/client-runtime/src/connection/registry.test.ts
          packages/client-runtime/src/state/commandPermissions.test.ts
          apps/web/src/components/files/openDirectoryInTerminal.test.ts
          apps/web/src/wslEditorDestinations.test.ts
          apps/web/src/wslEditorDestinations.hook.test.tsx
          apps/web/src/components/settings/WslSettings.test.tsx
          apps/desktop/src/wsl/DesktopWslPairing.test.ts
          apps/desktop/src/window/trayWindowPolicy.test.ts
          apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/desktop/src/updates/personalDesktopRelease.test.ts
          apps/server/src/vcs/GitVcsDriverCore.test.ts
          apps/server/src/project/AgentSessionScanner.test.ts
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
          apps/server/src/orchestration-v2/ProviderSessionManager.test.ts
          apps/server/src/orchestration-v2/RunExecutionService.test.ts
          apps/server/src/environment/DirectEndpoints.test.ts
          apps/server/src/relay/AgentAwarenessRelay.test.ts
          apps/server/src/relay/DirectActivityJournal.test.ts
          apps/server/src/relay/DirectActivity.test.ts
          apps/server/src/relay/DirectActivityHttp.test.ts
          apps/mobile/src/features/settings/DirectAlertsSettings.test.tsx
          packages/client-runtime/src/state/threadRelationships.test.ts
          packages/client-runtime/src/platform/storageDocument.test.ts
          apps/web/src/components/settings/RenameConnectionDialog.test.tsx
          apps/web/src/components/chat/ThreadRelationshipsControl.agents.test.tsx
          apps/web/src/components/ChatMarkdown.test.tsx
          apps/web/src/components/ChatMarkdown.assets.test.tsx
          apps/web/src/components/ChatMarkdown.permissions.test.tsx
          apps/web/src/markdown-incremental.test.tsx
          apps/web/src/components/chat/cachedMarkdownParse.test.tsx
          apps/web/src/components/chat/markdownStreamBlocks.test.tsx
          apps/desktop/src/app/DesktopConnectionCatalogStore.test.ts
      - name: Terminal resize with the web WASM asset configuration
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: timeout 600 vp test run --project unit --maxWorkers 1 src/terminal/ghostty/surface.test.ts
      - name: Install Chromium for isolated client fixtures
        id: chromium
        if: ${{ !cancelled() }}
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Hosted composer and sidebar browser regressions
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: timeout 300 node apps/server/scripts/upstream-performance-smoke.mjs
      - name: Scoped lint
        if: ${{ !cancelled() }}
        run: >-
          vp lint apps/web/src/components/ChatMarkdown.test.tsx apps/web/src/components/ChatMarkdown.assets.test.tsx apps/server/scripts/upstream-performance-smoke.mjs apps/server/src/environment/DirectEndpoints.test.ts apps/server/src/environment/DirectEndpoints.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts apps/server/src/project/AgentSessionScanner.test.ts apps/server/src/project/AgentSessionScanner.ts apps/server/src/relay/AgentAwarenessRelay.test.ts apps/server/src/relay/AgentAwarenessRelay.ts apps/server/src/vcs/GitVcsDriverCore.test.ts apps/server/src/vcs/GitVcsDriverCore.ts apps/web/src/components/ChatMarkdown.tsx apps/web/src/components/Sidebar.tsx apps/web/src/components/chat/ThreadLineageWorkflowRow.tsx apps/web/src/components/chat/ThreadRelationshipsControl.agents.test.tsx apps/web/src/components/chat/ThreadRelationshipsControl.tsx apps/web/src/components/chat/cachedMarkdownParse.test.tsx apps/web/src/components/chat/cachedMarkdownParse.ts apps/web/src/components/chat/markdownStreamBlocks.test.tsx apps/web/src/components/chat/markdownStreamBlocks.ts apps/web/src/components/chat/useComposerMultilinePrompt.ts apps/web/src/components/sidebar/routeReveal.ts apps/web/test-fixtures/upstream-performance.tsx packages/client-runtime/src/state/threadRelationships.test.ts packages/client-runtime/src/state/threadRelationships.ts
          apps/server/src/process/externalLauncher.ts apps/server/src/process/externalLauncher.test.ts
          apps/web/src/terminal/ghostty/surface.ts apps/web/src/terminal/ghostty/surface.test.ts
          packages/client-runtime/src/connection/registry.ts packages/client-runtime/src/connection/registry.test.ts
          apps/desktop/src/updates/DesktopUpdates.ts apps/desktop/src/updates/DesktopUpdates.test.ts
          apps/desktop/src/updates/updatesTestHarness.ts
      - name: Client runtime types
        if: ${{ !cancelled() }}
        run: timeout 600 vp run --filter @t3tools/client-runtime typecheck
      - name: Web types
        if: ${{ !cancelled() }}
        run: timeout 600 vp run --filter @t3tools/web typecheck
      - name: Server types
        if: ${{ !cancelled() }}
        run: timeout 600 vp run --filter t3 typecheck
      - name: Desktop types
        if: ${{ !cancelled() }}
        run: timeout 600 vp run --filter @t3tools/desktop typecheck
      - name: Mobile types
        if: ${{ !cancelled() }}
        run: timeout 600 vp run --filter @t3tools/mobile typecheck
  windows:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Real PowerShell launch and scope cleanup regressions
        run: vp test run --maxWorkers 1 apps/server/src/process/externalLauncher.test.ts apps/server/src/environment/DirectEndpoints.test.ts

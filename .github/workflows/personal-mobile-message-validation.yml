name: Personal direct Android alerts validation
on:
  workflow_dispatch:
    inputs:
      android_native:
        description: Run native Android compilation, tests and lint (retain prior evidence only when mobile sources are unchanged)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  activity:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: node:26-bookworm
      options: --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Direct activity authorization, replay and mobile routing
        run: vp test run --maxWorkers 1 scripts/imaorise/release-reservation.test.ts apps/server/src/relay/DirectActivityJournal.test.ts apps/server/src/relay/DirectActivity.test.ts apps/server/src/relay/DirectActivityHttp.test.ts apps/mobile/src/features/agent-awareness/directAlertTarget.test.ts apps/mobile/src/features/settings/DirectAlertsSettings.test.tsx apps/mobile/src/features/settings/SettingsRouteScreen.test.tsx apps/server/src/relay/AgentAwarenessRelay.test.ts packages/shared/src/agentAwareness.test.ts
      - name: Scoped lint
        run: vp lint scripts/imaorise/release-reservation.mjs scripts/imaorise/release-reservation.test.ts apps/mobile/src/App.tsx apps/mobile/src/features/agent-awareness/DirectAlertsCoordinator.tsx apps/mobile/src/features/agent-awareness/directAlertTarget.test.ts apps/mobile/src/features/agent-awareness/directAlertTarget.ts apps/mobile/src/features/agent-awareness/directAlerts.ts apps/mobile/src/features/settings/DirectAlertsSettings.test.tsx apps/mobile/src/features/settings/SettingsRouteScreen.test.tsx apps/mobile/src/features/settings/DirectAlertsSettings.tsx apps/mobile/src/features/settings/SettingsNotificationsRouteScreen.tsx apps/mobile/src/features/settings/SettingsRouteScreen.tsx apps/server/src/environment/ServerEnvironment.ts apps/server/src/http.ts apps/server/src/relay/DirectActivity.test.ts apps/server/src/relay/DirectActivity.ts apps/server/src/relay/DirectActivityHttp.test.ts scripts/imaorise/release-reservation.test.ts apps/server/src/relay/DirectActivityJournal.test.ts apps/server/src/relay/DirectActivityJournal.ts apps/server/src/server.ts packages/contracts/src/directActivity.ts packages/contracts/src/environment.ts packages/contracts/src/index.ts
      - name: Contracts types
        run: timeout 600 vp run --filter @t3tools/contracts typecheck
      - name: Mobile types
        run: timeout 600 vp run --filter @t3tools/mobile typecheck
      - name: Server types
        run: timeout 900 vp run --filter t3 typecheck
  android-native:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true' && inputs.android_native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
      APP_VARIANT: production
      T3CODE_IMAORISE_MOBILE_CONNECT_ENABLED: '0'
      T3CODE_IMAORISE_MOBILE_OTA_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Generate isolated Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --clean --no-install
      - name: Install locked Android toolchain
        working-directory: apps/mobile
        shell: bash
        run: |
          read -r ndk sdk buildTools < <(node -e 'const s=require("fs").readFileSync("node_modules/react-native/gradle/libs.versions.toml","utf8"); const value=k=>s.match(new RegExp(k+"\\s*=\\s*\"([^\"]+)\""))?.[1]; console.log(value("ndkVersion"),value("compileSdk"),value("buildTools"))')
          catalog=$(sdkmanager --list)
          platformPackage="platforms;android-$sdk"
          if [[ "$catalog" != *"$platformPackage "* ]]; then platformPackage="platforms;android-$sdk.0"; fi
          sdkmanager "ndk;$ndk" "$platformPackage" "build-tools;$buildTools" 'cmake;3.22.1'
      - name: Native service, credential, cancellation and protocol tests; Android lint
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --max-workers=2 :t3-agent-notifications:testDebugUnitTest :t3-agent-notifications:lintRelease -Pandroid.lint.useK2Uast=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-alerts-native-evidence
          path: |
            apps/mobile/modules/t3-agent-notifications/android/build/reports/tests
            apps/mobile/modules/t3-agent-notifications/android/build/reports/lint-results*
          retention-days: 7

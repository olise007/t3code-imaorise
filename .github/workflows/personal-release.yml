name: Personal Windows and Android release
on:
  push:
    branches: [imaorise]
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, stable]
        default: beta
      publish:
        description: Publish after reviewing acceptance evidence; false keeps a draft
        type: boolean
        default: false
      target:
        description: Select affected release surfaces automatically or override
        type: choice
        options: [auto, android, desktop, all]
        default: auto
      tested_beta:
        description: Published tested beta tag required for Stable
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || vars.PERSONAL_BETA_ACCEPTED == 'true') && 'personal-release' || format('personal-disabled-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  reserve:
    if: github.repository == 'olise007/t3code-imaorise' && github.ref == 'refs/heads/imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true' && (github.event_name == 'workflow_dispatch' || vars.PERSONAL_BETA_ACCEPTED == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'stable' && 'personal-stable' || 'personal-release' }}
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.reserve.outputs.revision }}
      version: ${{ steps.reserve.outputs.version }}
      version_code: ${{ steps.reserve.outputs.version_code }}
      tag: ${{ steps.reserve.outputs.tag }}
      channel: ${{ steps.reserve.outputs.channel }}
      android: ${{ steps.reserve.outputs.android }}
      desktop: ${{ steps.reserve.outputs.desktop }}
      has_targets: ${{ steps.reserve.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'beta' }}
          TESTED_BETA: ${{ inputs.tested_beta }}
          RELEASE_TARGET: ${{ inputs.target || 'auto' }}
        run: node scripts/imaorise/release-reservation.mjs
  linux:
    if: needs.reserve.outputs.desktop == 'true'
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.reserve.outputs.revision }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp install --frozen-lockfile
      - name: Focused release checks
        run: vp test run apps/mobile/src/features/threads/plan-action-state.test.ts apps/mobile/src/state/legacy-plan-mode.test.ts apps/web/src/connection/platformPairing.test.ts apps/desktop/src/wsl/DesktopWslPairing.test.ts apps/web/src/rpc/environmentAccess.test.ts apps/web/src/proposedPlan.test.ts apps/web/src/pendingUserInput.test.ts apps/web/src/components/chat/ComposerPendingUserInputPanel.test.tsx apps/web/src/components/chat/ComposerPendingUserInputPanel.permissions.test.tsx apps/web/src/components/chat/ComposerPrimaryActions.test.tsx packages/shared/src/questionReview.test.ts apps/mobile/src/features/updates/personal-apk-manifest.test.ts apps/mobile/src/features/updates/personal-apk-updates.test.ts apps/desktop/src/settings/DesktopAppSettings.test.ts
      - name: Background runtime and commit preview checks
        run: |
          vp test run apps/server/src/desktopRuntime.test.ts apps/server/src/desktopRuntime.integration.test.ts apps/server/src/desktopUpdate/DesktopRuntimeManagement.test.ts apps/desktop/src/window/trayWindowPolicy.test.ts apps/desktop/src/wsl/backgroundRuntimePolicy.test.ts apps/desktop/src/updates/personalDesktopRelease.test.ts scripts/imaorise/release-targets.test.ts scripts/imaorise/release-reservation.test.ts scripts/imaorise/publish-release.test.ts packages/shared/src/personalReleaseAssets.test.ts apps/web/src/components/GitActionsControl.test.ts apps/server/src/git/GitManager.test.ts apps/server/src/orchestration-v2/runtimeLayer.test.ts
      - name: Backend startup recovery checks
        run: |
          vp test run apps/desktop/src/backend/DesktopBackendManager.test.ts apps/desktop/src/backend/startupRecovery.test.ts apps/desktop/src/backend/DesktopBackendConfiguration.test.ts apps/desktop/src/backend/DesktopBackendPool.test.ts apps/desktop/src/wsl/DesktopWslBackend.test.ts apps/desktop/src/wsl/DesktopWslEnvironment.test.ts apps/desktop/src/ipc/methods/window.test.ts
          vp run --filter @t3tools/desktop typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          GOMEMLIMIT: 2GiB
      - name: Record clean source and align generated package metadata
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
        env:
          SOURCE_REVISION: ${{ needs.reserve.outputs.revision }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
      - run: vp run build:desktop
        env:
          APP_VERSION: ${{ needs.reserve.outputs.version }}
      - name: Build matching Linux runtime
        env:
          VP_NODE_VERSION: "26.8.2"
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p apps/server/dist/resource-monitor/linux-x64
          cp native/resource-monitor/target/release/t3-resource-monitor apps/server/dist/resource-monitor/linux-x64/
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$RELEASE_VERSION" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$RELEASE_VERSION"
          mkdir -p /tmp/personal-runtime-smoke
          tar -xzf release-cli/*.tar.gz -C /tmp/personal-runtime-smoke
          python3 scripts/imaorise/smoke-background-runtime.py "/tmp/personal-runtime-smoke/t3-$RELEASE_VERSION-linux-x64/t3"
          node scripts/imaorise/ssh-packaged-smoke.ts "/tmp/personal-runtime-smoke/t3-$RELEASE_VERSION-linux-x64/t3" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-wsl-runtime
          path: release-cli/*.tar.gz
          retention-days: 1
          if-no-files-found: error
  windows:
    if: needs.reserve.outputs.desktop == 'true'
    needs: [reserve, linux]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.reserve.outputs.revision }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: personal-wsl-runtime
          path: ${{ runner.temp }}/wsl-runtime
      - name: Build unsigned personal NSIS with matching WSL runtime
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: olise007/t3code-imaorise
          APP_VERSION: ${{ needs.reserve.outputs.version }}
        run: |
          if (git status --porcelain) { throw 'Source must be clean before generating package metadata.' }
          node scripts/update-release-package-versions.ts $env:RELEASE_VERSION
          vp run build:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VP_NODE_VERSION = '26.8.2'
          node apps/server/scripts/cli.ts build-exe --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force apps/server/dist/resource-monitor/win32-x64 | Out-Null
          Copy-Item native/resource-monitor/target/release/t3-resource-monitor.exe apps/server/dist/resource-monitor/win32-x64/
          node scripts/build-cli-archive.ts --platform win --arch x64 --version $env:RELEASE_VERSION --output-dir release-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-cli-archive.ts --archive (Get-ChildItem release-cli/*.zip).FullName --expect-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sshSmoke = Join-Path $env:RUNNER_TEMP 'packaged-ssh-smoke'
          Expand-Archive -LiteralPath (Get-ChildItem release-cli/*.zip).FullName -DestinationPath $sshSmoke
          node scripts/imaorise/ssh-packaged-smoke.ts (Get-ChildItem $sshSmoke -Recurse -Filter t3.exe).FullName $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:T3CODE_DESKTOP_SSH_WINDOWS_RUNTIME = (Get-ChildItem release-cli/*.zip).FullName
          $runtime = (Get-ChildItem "$env:RUNNER_TEMP/wsl-runtime/*.tar.gz").FullName
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version $env:RELEASE_VERSION --wsl-runtime $runtime --skip-build --output-dir personal-windows --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: personal-windows
          path: |
            personal-windows/*.exe
            personal-windows/*.yml
            release-cli/*-win32-x64.zip
            personal-windows/*.blockmap
          retention-days: 1
          if-no-files-found: error
  android:
    if: needs.reserve.outputs.android == 'true'
    needs: reserve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: personal-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.reserve.outputs.revision }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore existing personal signing key
        env:
          KEYSTORE: ${{ secrets.IMAORISE_ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.IMAORISE_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/personal-signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/personal-signing/android.keystore"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/personal-signing/password"
      - name: Build and verify signed ARM64 APK
        env:
          SOURCE_REVISION: ${{ needs.reserve.outputs.revision }}
          T3CODE_IMAORISE_VERSION: ${{ needs.reserve.outputs.version }}
          T3CODE_IMAORISE_ANDROID_VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
          T3CODE_IMAORISE_SIGNING_DIRECTORY: ${{ runner.temp }}/personal-signing
        run: bash scripts/imaorise/android.sh "$RUNNER_TEMP/personal-android" "$SOURCE_REVISION"
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/personal-signing"
      - name: Retain Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personal-android-diagnostics
          path: ${{ runner.temp }}/personal-android/*
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: personal-android
          path: ${{ runner.temp }}/personal-android/*
          retention-days: 1
          if-no-files-found: error
  publish:
    if: always() && needs.reserve.result == 'success' && needs.reserve.outputs.has_targets == 'true' && (needs.reserve.outputs.desktop != 'true' || (needs.linux.result == 'success' && needs.windows.result == 'success')) && (needs.reserve.outputs.android != 'true' || needs.android.result == 'success')
    needs: [reserve, linux, windows, android]
    runs-on: ubuntu-latest
    environment: personal-release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.reserve.outputs.revision }}
      - uses: actions/download-artifact@v4
        with:
          pattern: personal-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.reserve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.reserve.outputs.channel }}
          INCLUDE_ANDROID: ${{ needs.android.result == 'success' }}
          INCLUDE_DESKTOP: ${{ needs.windows.result == 'success' }}
          INCLUDE_WINDOWS_SSH_RUNTIME: ${{ needs.windows.result == 'success' }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
          VERSION_CODE: ${{ needs.reserve.outputs.version_code }}
          SOURCE_REVISION: ${{ needs.reserve.outputs.revision }}
        run: node scripts/imaorise/publish-release.mjs
      - name: Remove temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' | while read -r artifact; do gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"; done

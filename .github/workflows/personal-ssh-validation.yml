name: Personal upstream integration validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: node:26-bookworm
      options: --init --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
      T3_UPSTREAM_SSH_FIXTURE: container
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Focused upstream SSH and preserved settings regressions
        run: timeout 900 vp test run --maxWorkers 1 packages/ssh/src packages/contracts/src/ipc.test.ts apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/web/src/connection/platform.test.ts apps/web/src/state/desktopSshHosts.test.ts apps/web/src/components/settings/ConnectionsSettings.logic.test.ts apps/web/src/components/settings/EnvironmentRoutesList.test.tsx apps/web/src/components/settings/WslSettings.test.tsx apps/web/src/components/settings/ProviderAuthenticationSection.codex.test.tsx apps/web/src/versionSkew.test.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx packages/client-runtime/src/connection
      - name: Upstream provider management and retained execution regressions
        if: ${{ !cancelled() }}
        run: timeout 900 vp test run --maxWorkers 1 packages/shared/src/codexAuthHandoff.test.ts packages/shared/src/providerAuthReturnUrl.test.ts apps/server/src/provider/CodexInstallation.test.ts apps/server/src/provider/AntigravityInstallation.test.ts apps/server/src/provider/CodexChatGptAuth.test.ts apps/server/src/provider/providerInstallation.test.ts apps/server/src/provider/providerMaintenanceRunner.test.ts apps/server/src/provider/ProviderAuthService.test.ts packages/provider-core/src/server/maintenanceResolver.test.ts packages/client-runtime/src/state/commandPermissions.test.ts apps/web/src/rpc/environmentAccess.test.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts apps/web/src/components/settings/ProviderSettingsPanel.environment.test.tsx apps/web/src/components/settings/AddProviderInstanceDialog.environment.test.tsx apps/web/src/components/settings/ProviderSetupSection.test.tsx apps/web/src/components/settings/ProviderAuthenticationSection.codex.test.tsx
      - name: Approved integration behavior regressions
        if: ${{ !cancelled() }}
        run: timeout 1200 vp test run --maxWorkers 1 apps/desktop/src/ssh/DesktopSshEnvironment.test.ts apps/server/src/assets/AssetAccess.test.ts apps/server/src/cloud/CloudLink.lifecycle.test.ts apps/server/src/cloud/CloudLink.test.ts apps/server/src/cloud/ConnectReachability.test.ts apps/server/src/cloud/ManagedEndpointRuntime.test.ts apps/server/src/cloud/http.test.ts apps/server/src/device/SshDeviceHost.test.ts apps/server/src/environment/RemoteOpenTargets.test.ts apps/server/src/observability/EventLoopMonitor.test.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts apps/server/src/project/ManagedProjectFolders.test.ts apps/server/src/project/ProjectEnrichmentService.test.ts apps/server/src/project/ProjectFaviconResolver.test.ts apps/server/src/project/ProjectService.deletion.test.ts apps/server/src/project/ProjectService.test.ts apps/server/src/provider/CodexProvider.test.ts apps/server/src/provider/ProviderRegistry.test.ts apps/server/src/provider/providerCompatibility.test.ts apps/server/src/provider/providerMaintenanceRunner.test.ts apps/server/src/terminal/Manager.test.ts apps/server/src/terminal/OutputProtocol.test.ts apps/server/src/workspace/WorkspaceEntries.test.ts apps/web/src/connection/platform.test.ts apps/web/src/lib/addProjectToMachine.test.ts apps/web/src/rpc/requestLatencyState.test.ts apps/web/src/state/desktopSshHosts.test.ts infra/relay/src/environments/EnvironmentConnector.test.ts infra/relay/src/environments/endpointFailure.test.ts packages/client-runtime/src/connection/diagnosis.test.ts packages/client-runtime/src/connection/hostFreeze.test.ts packages/client-runtime/src/errors/transport.test.ts packages/client-runtime/src/rpc/client.test.ts packages/client-runtime/src/rpc/session.test.ts packages/client-runtime/src/state/server.test.ts packages/ssh/src/command.test.ts packages/ssh/src/config.test.ts packages/ssh/src/tunnel.test.ts packages/tailscale/src/tailscale.test.ts
      - name: Copy confinement and cancellation regressions
        if: ${{ !cancelled() }}
        run: timeout 300 vp test run --maxWorkers 1 apps/server/src/workspace/WorkspaceFileSystem.test.ts apps/web/src/lib/addProjectToMachine.test.ts apps/web/src/components/AddProjectToMachineDialog.test.tsx packages/client-runtime/src/state/commandPermissions.test.ts apps/mobile/src/features/threads/plan-action-availability.test.ts apps/mobile/src/features/threads/plan-action-state.test.ts
      - name: Relay HTTP status and trace preservation
        if: ${{ !cancelled() }}
        run: timeout 300 vp test run --maxWorkers 1 packages/client-runtime/src/relay/managedRelay.test.ts
      - name: Official runtime SSH and application compatibility
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-server curl libatomic1
          timeout 420 node scripts/imaorise/ssh-upstream-smoke.ts
      - name: Contracts and affected package typechecks
        if: ${{ !cancelled() }}
        run: |
          validation_status=0
          for validation_package in @t3tools/contracts @t3tools/ssh @t3tools/shared @t3tools/provider-core @t3tools/client-runtime @t3tools/web @t3tools/desktop t3 @t3tools/mobile t3code-relay; do
            vp run --filter "$validation_package" typecheck || validation_status=1
          done
          vp exec tsc-rs --project scripts/tsconfig.ssh-setup.json --noEmit || validation_status=1
          exit "$validation_status"
      - name: Scoped lint
        if: ${{ !cancelled() }}
        run: vp lint apps/web/src/hooks/useLogicalProjectEnvironments.ts packages/client-runtime/src/relay/managedRelay.ts packages/client-runtime/src/relay/managedRelay.test.ts apps/server/src/workspace/WorkspaceFileSystem.ts apps/server/src/workspace/WorkspaceFileSystem.test.ts apps/web/src/components/AddProjectToMachineDialog.test.tsx packages/client-runtime/src/state/commandPermissions.test.ts apps/desktop/src/ssh/DesktopSshEnvironment.test.ts apps/mobile/src/features/connection/CloudEnvironmentRows.tsx apps/mobile/src/features/connection/ConnectionDiagnosisDetails.tsx apps/mobile/src/features/connection/ConnectionEnvironmentRow.tsx apps/mobile/src/features/threads/thread-work-log.tsx apps/server/src/assets/AssetAccess.test.ts apps/server/src/assets/AssetAccess.ts apps/server/src/auth/RpcAuthorization.ts apps/server/src/cli/connect.ts apps/server/src/cloud/CloudLink.lifecycle.test.ts apps/server/src/cloud/CloudLink.test.ts apps/server/src/cloud/CloudLink.ts apps/server/src/cloud/ConnectReachability.test.ts apps/server/src/cloud/ConnectReachability.ts apps/server/src/cloud/ManagedEndpointRuntime.test.ts apps/server/src/cloud/ManagedEndpointRuntime.ts apps/server/src/cloud/http.test.ts apps/server/src/cloud/http.ts apps/server/src/device/SshDeviceHost.test.ts apps/server/src/device/SshDeviceHost.ts apps/server/src/environment/RemoteOpenTargets.test.ts apps/server/src/environment/RemoteOpenTargets.ts apps/server/src/environment/ServerEnvironment.ts apps/server/src/observability/EventLoopMonitor.test.ts apps/server/src/observability/EventLoopMonitor.ts apps/server/src/observability/Metrics.ts apps/server/src/observability/RpcInstrumentation.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts apps/server/src/project/ManagedProjectFolders.test.ts apps/server/src/project/ProjectEnrichmentService.test.ts apps/server/src/project/ProjectEnrichmentService.ts apps/server/src/project/ProjectFaviconResolver.test.ts apps/server/src/project/ProjectFaviconResolver.ts apps/server/src/project/ProjectService.deletion.test.ts apps/server/src/project/ProjectService.test.ts apps/server/src/provider/CodexProvider.test.ts apps/server/src/provider/CodexProvider.ts apps/server/src/provider/ProviderRegistry.test.ts apps/server/src/provider/ProviderRegistry.ts apps/server/src/provider/providerCompatibility.test.ts apps/server/src/provider/providerMaintenanceRunner.test.ts apps/server/src/provider/providerMaintenanceRunner.ts apps/server/src/provider/testUtils/providerRegistryMock.ts apps/server/src/provider/unavailableProviderSnapshot.ts apps/server/src/server.ts apps/server/src/terminal/Manager.test.ts apps/server/src/terminal/Manager.ts apps/server/src/terminal/OutputProtocol.test.ts apps/server/src/terminal/OutputProtocol.ts apps/server/src/workspace/WorkspaceEntries.test.ts apps/server/src/workspace/WorkspaceEntries.ts apps/server/src/ws.ts apps/web/src/components/AddProjectToMachineDialog.tsx apps/web/src/components/BranchToolbar.logic.ts apps/web/src/components/BranchToolbar.tsx apps/web/src/components/BranchToolbarEnvironmentSelector.tsx apps/web/src/components/ChatView.tsx apps/web/src/components/HostFreezeToastCoordinator.tsx apps/web/src/components/ProjectCloneToastCoordinator.tsx apps/web/src/components/desktop/SshPasswordPromptDialog.tsx apps/web/src/components/settings/CodexSetupSection.tsx apps/web/src/components/settings/ConnectionDiagnosisDetails.tsx apps/web/src/components/settings/ConnectionsSettings.tsx apps/web/src/connection/platform.test.ts apps/web/src/connection/platform.ts apps/web/src/hooks/useAddProjectTargets.ts apps/web/src/lib/addProjectToMachine.test.ts apps/web/src/lib/addProjectToMachine.ts apps/web/src/routes/__root.tsx apps/web/src/rpc/requestLatencyState.test.ts apps/web/src/rpc/requestLatencyState.ts apps/web/src/state/desktopSshHosts.test.ts apps/web/src/state/desktopSshHosts.ts apps/web/src/state/projectClones.ts infra/relay/src/environments/EnvironmentConnector.test.ts infra/relay/src/environments/EnvironmentConnector.ts infra/relay/src/environments/endpointFailure.test.ts infra/relay/src/environments/endpointFailure.ts infra/relay/src/http/Api.ts packages/client-runtime/src/connection/diagnosis.test.ts packages/client-runtime/src/connection/diagnosis.ts packages/client-runtime/src/connection/errors.ts packages/client-runtime/src/connection/hostFreeze.test.ts packages/client-runtime/src/connection/hostFreeze.ts packages/client-runtime/src/connection/index.ts packages/client-runtime/src/connection/model.ts packages/client-runtime/src/errors/network.ts packages/client-runtime/src/errors/transport.test.ts packages/client-runtime/src/errors/transport.ts packages/client-runtime/src/rpc/client.test.ts packages/client-runtime/src/rpc/client.ts packages/client-runtime/src/rpc/session.test.ts packages/client-runtime/src/rpc/session.ts packages/client-runtime/src/state/projectCommands.ts packages/client-runtime/src/state/server.test.ts packages/client-runtime/src/state/server.ts packages/client-runtime/src/work-log/presentation.ts packages/contracts/src/clientRpcPermissions.ts packages/contracts/src/environment.ts packages/contracts/src/environmentHttp.ts packages/contracts/src/project.ts packages/contracts/src/relay.ts packages/contracts/src/rpc.ts packages/contracts/src/server.ts packages/provider-core/src/server/snapshotProbe.ts packages/ssh/src/command.test.ts packages/ssh/src/command.ts packages/ssh/src/config.test.ts packages/ssh/src/config.ts packages/ssh/src/tunnel.test.ts packages/ssh/src/tunnel.ts packages/tailscale/src/tailscale.test.ts packages/tailscale/src/tailscale.ts
  windows:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Native Windows SSH client discovery authentication and lifecycle
        run: vp test run --maxWorkers 1 packages/ssh/src apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts packages/contracts/src/ipc.test.ts

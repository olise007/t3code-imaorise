name: Personal SSH environments validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: node:26-bookworm
      options: --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
      T3_UPSTREAM_SSH_FIXTURE: container
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Focused upstream SSH and preserved settings regressions
        run: timeout 900 vp test run --maxWorkers 1 packages/ssh/src packages/contracts/src/ipc.test.ts apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/web/src/connection/platform.test.ts apps/web/src/state/desktopSshHosts.test.ts apps/web/src/components/settings/ConnectionsSettings.logic.test.ts apps/web/src/components/settings/EnvironmentRoutesList.test.tsx apps/web/src/components/settings/WslSettings.test.tsx apps/web/src/components/settings/ProviderAuthenticationSection.codex.test.tsx apps/web/src/components/settings/ProviderVersions.test.tsx apps/web/src/versionSkew.test.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx packages/client-runtime/src/connection
      - name: Official runtime SSH and application compatibility
        timeout-minutes: 10
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-server curl libatomic1
          timeout 420 node scripts/imaorise/ssh-upstream-smoke.ts
      - name: Contracts and affected package typechecks
        if: ${{ !cancelled() }}
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/ssh typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/mobile typecheck
          vp exec tsc-rs --project scripts/tsconfig.ssh-setup.json --noEmit
      - name: Scoped lint
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          const files = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACMR', 'a21aeb787de1ea2c115b183af1e0d2af2b8666ef', 'HEAD'], {encoding:'utf8'}).trim().split('\n').filter(path => /\.[cm]?[jt]sx?$/.test(path));
          execFileSync('vp', ['lint', ...files], {stdio:'inherit'});
          JS
  windows:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Native Windows SSH client discovery authentication and lifecycle
        run: vp test run --maxWorkers 1 packages/ssh/src apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts packages/contracts/src/ipc.test.ts

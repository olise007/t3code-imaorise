name: Personal SSH environments validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: node:24-bookworm
      options: --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Focused SSH tests
        run: timeout 900 vp test run --maxWorkers 1 packages/ssh/src packages/client-runtime/src/connection/routes.test.ts packages/client-runtime/src/connection/resolver.test.ts apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/server/src/cli/sshManagedRuntime.test.ts apps/web/src/state/desktopSshHosts.test.ts apps/web/src/components/settings/ConnectionsSettings.logic.test.ts scripts/imaorise/publish-release.test.ts apps/server/src/provider/providerInstallation.test.ts apps/server/src/provider/ManagedProviderArchives.test.ts apps/server/src/provider/CodexInstallation.test.ts apps/server/src/provider/AntigravityInstallation.test.ts packages/shared/src/nodeRuntime.test.ts scripts/build-desktop-artifact.test.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx apps/server/src/auth/RpcAuthorization.test.ts
      - name: Isolated Linux OpenSSH session survival
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-server
          timeout 120 node scripts/imaorise/ssh-linux-smoke.ts
      - name: Contracts and SSH typechecks
        if: ${{ !cancelled() }}
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/ssh typecheck
          vp run --filter @t3tools/shared typecheck
          vp exec tsc-rs --project scripts/tsconfig.ssh-setup.json --noEmit
      - name: Client typechecks
        if: ${{ !cancelled() }}
        run: |
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop typecheck
      - name: Server typecheck
        if: ${{ !cancelled() }}
        run: vp run --filter t3 typecheck
      - name: Mobile compatibility typecheck
        if: ${{ !cancelled() }}
        run: vp run --filter @t3tools/mobile typecheck
      - name: Scoped lint
        if: ${{ !cancelled() }}
        run: vp lint apps/desktop/src/ipc/DesktopIpcHandlers.ts apps/desktop/src/ipc/channels.ts apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/desktop/src/ipc/methods/sshEnvironment.ts apps/desktop/src/main.ts apps/desktop/src/preload.ts apps/desktop/src/ssh/DesktopSshEnvironment.ts apps/desktop/src/ssh/DesktopSshPasswordPrompts.ts apps/server/src/auth/RpcAuthorization.ts apps/server/src/cli/sshHelper.ts apps/server/src/cli/sshManagedRuntime.ts apps/server/src/observability/RpcInstrumentation.ts apps/server/src/provider/AntigravityInstallation.ts apps/server/src/provider/CodexInstallation.ts apps/server/src/provider/ManagedProviderArchives.test.ts apps/server/src/provider/ManagedProviderArchives.ts apps/server/src/provider/providerInstallation.test.ts apps/server/src/provider/providerInstallation.ts apps/server/src/provider/testFixtures/verifiedRecipes.ts apps/server/src/server.ts apps/server/src/ws.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx apps/web/src/components/desktop/SshPasswordPromptDialog.tsx apps/web/src/components/settings/ConnectionsSettings.tsx apps/web/src/connection/onboarding.ts apps/web/src/connection/platform.ts packages/client-runtime/src/connection/onboarding.ts packages/client-runtime/src/state/server.ts packages/contracts/src/clientRpcPermissions.ts packages/contracts/src/index.ts packages/contracts/src/ipc.ts packages/contracts/src/providerSetup.ts packages/contracts/src/rpc.ts packages/contracts/src/sshSetup.ts packages/shared/src/nodeRuntime.ts packages/shared/src/providerInstallRecipes.ts packages/ssh/src/auth.ts packages/ssh/src/bundledRuntime.test.ts packages/ssh/src/bundledRuntime.ts packages/ssh/src/command.test.ts packages/ssh/src/command.ts packages/ssh/src/prerequisites.test.ts packages/ssh/src/prerequisites.ts packages/ssh/src/testFixtures/prerequisitesSmoke.ts packages/ssh/src/tunnel.ts packages/ssh/src/windowsPrerequisites.test.ts scripts/build-cli-archive.ts scripts/build-desktop-artifact.test.ts scripts/build-desktop-artifact.ts scripts/lib/runtime-requirements.ts scripts/smoke-cli-archive.ts
  windows:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Native Windows supervisor and source tests
        run: vp test run --maxWorkers 1 packages/ssh/src/source.test.ts packages/ssh/src/askpass.test.ts packages/ssh/src/bundledRuntime.test.ts packages/ssh/src/prerequisites.test.ts packages/ssh/src/windowsPrerequisites.test.ts apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/server/src/cli/sshManagedRuntime.test.ts
      - name: Verified vendor provider archives
        run: node apps/server/src/provider/testFixtures/verifiedRecipes.ts
      - name: Isolated Windows OpenSSH default shells and reconnect
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/imaorise/ssh-windows-smoke.ps1

  linux-prerequisites:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Minimal Linux missing-libatomic review and installation
        timeout-minutes: 10
        run: node packages/ssh/src/testFixtures/prerequisitesSmoke.ts
      - name: Verified Linux vendor provider archives
        timeout-minutes: 15
        run: node apps/server/src/provider/testFixtures/verifiedRecipes.ts

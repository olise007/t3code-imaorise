name: Personal SSH environments validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: node:26-bookworm
      options: --init --memory=6g --memory-swap=6g --cpus=2
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GOMEMLIMIT: 5GiB
      T3_UPSTREAM_SSH_FIXTURE: container
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Focused upstream SSH and preserved settings regressions
        run: timeout 900 vp test run --maxWorkers 1 packages/ssh/src packages/contracts/src/ipc.test.ts apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/web/src/connection/platform.test.ts apps/web/src/state/desktopSshHosts.test.ts apps/web/src/components/settings/ConnectionsSettings.logic.test.ts apps/web/src/components/settings/EnvironmentRoutesList.test.tsx apps/web/src/components/settings/WslSettings.test.tsx apps/web/src/components/settings/ProviderAuthenticationSection.codex.test.tsx apps/web/src/components/settings/ProviderVersions.test.tsx apps/web/src/versionSkew.test.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx packages/client-runtime/src/connection
      - name: Official runtime SSH and application compatibility
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openssh-server curl libatomic1
          timeout 420 node scripts/imaorise/ssh-upstream-smoke.ts
      - name: Contracts and affected package typechecks
        if: ${{ !cancelled() }}
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/ssh typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/desktop typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/mobile typecheck
          vp exec tsc-rs --project scripts/tsconfig.ssh-setup.json --noEmit
      - name: Scoped lint
        if: ${{ !cancelled() }}
        run: vp lint apps/desktop/src/ipc/DesktopIpcHandlers.ts apps/desktop/src/ipc/methods/sshEnvironment.test.ts apps/desktop/src/ipc/methods/sshEnvironment.ts apps/desktop/src/main.ts apps/desktop/src/preload.ts apps/desktop/src/ssh/DesktopSshEnvironment.test.ts apps/desktop/src/ssh/DesktopSshEnvironment.ts apps/desktop/src/ssh/DesktopSshPasswordPrompts.ts apps/web/src/components/desktop/SshPasswordPromptDialog.test.tsx apps/web/src/components/desktop/SshPasswordPromptDialog.tsx apps/web/src/components/settings/ConnectionsSettings.tsx apps/web/src/components/settings/EnvironmentRoutesList.test.tsx apps/web/src/components/settings/EnvironmentRoutesList.tsx apps/web/src/connection/onboarding.ts apps/web/src/connection/platform.test.ts apps/web/src/connection/platform.ts apps/web/src/versionSkew.test.ts apps/web/src/versionSkew.ts packages/client-runtime/src/connection/driver.test.ts packages/client-runtime/src/connection/driver.ts packages/contracts/src/ipc.test.ts packages/contracts/src/ipc.ts packages/shared/src/cliRelease.ts packages/ssh/src/auth.test.ts packages/ssh/src/auth.ts packages/ssh/src/command.test.ts packages/ssh/src/command.ts packages/ssh/src/config.test.ts packages/ssh/src/config.ts packages/ssh/src/runnerProcess.test.ts packages/ssh/src/tunnel.test.ts packages/ssh/src/tunnel.ts scripts/imaorise/ssh-upstream-smoke.ts scripts/imaorise/ssh-packaged-smoke.ts
  windows:
    if: github.repository == 'olise007/t3code-imaorise' && vars.PERSONAL_ZERO_SPEND_VERIFIED == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Native Windows SSH client discovery authentication and lifecycle
        run: vp test run --maxWorkers 1 packages/ssh/src apps/desktop/src/ssh apps/desktop/src/ipc/methods/sshEnvironment.test.ts packages/contracts/src/ipc.test.ts
